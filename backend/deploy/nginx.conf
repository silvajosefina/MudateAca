# Nginx recibe todo el tráfico del dominio: pasa la API y el panel de administración a Gunicorn,
# y sirve los estilos del panel y el frontend. Certbot agrega después la parte de HTTPS.
# Instalación: sudo cp deploy/nginx.conf /etc/nginx/sites-available/mudateaca
server {
    listen 80;
    server_name mudateaca.duckdns.org;

    # Una publicación lleva al menos 3 fotos y un documento, de hasta 10 MB cada uno.
    client_max_body_size 60M;

    location /static/ {
        alias /srv/mudateaca/backend/staticfiles/;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Implementación 2): la aplicación compilada con `npm run build`.
    location / {
        root /srv/mudateaca/frontend/dist;
        try_files $uri /index.html;
    }
}
