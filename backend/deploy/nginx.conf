# Nginx recibe todo el tráfico del dominio: pasa la API y el panel de administración a Gunicorn,
# y sirve los estilos del panel y el frontend (PWA).
#
# Instalación en el servidor (el certificado ya existe, lo creó Certbot):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mudateaca
#   sudo nginx -t && sudo systemctl reload nginx
#
# En un servidor nuevo, sin certificado, primero hay que obtenerlo con
#   sudo certbot certonly --nginx -d mudateaca.duckdns.org
# y después copiar este archivo.

# HTTP: todo se redirige a HTTPS (RNF-07), salvo la verificación con la que Certbot renueva
# el certificado cada 90 días.
server {
    listen 80;
    server_name mudateaca.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mudateaca.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mudateaca.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mudateaca.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Una publicación lleva al menos 3 fotos y un documento, de hasta 10 MB cada uno.
    client_max_body_size 60M;

    # Compresión de texto: el paquete principal del frontend baja de ~270 KB a ~80 KB.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API y panel de Django: los encabezados de seguridad los agrega Django.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/mudateaca/backend/staticfiles/;
        expires 7d;
    }

    # Frontend: la aplicación compilada con `npm run build` (frontend/desplegar.ps1).
    root /srv/mudateaca/frontend/dist;

    # Los archivos de /assets/ llevan un hash en el nombre: si cambian, cambia el nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # El navegador tiene que revisar siempre si hay una versión nueva de la PWA.
    location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de la aplicación (/explorar, /mensajes...): las resuelve React con el index.html.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
